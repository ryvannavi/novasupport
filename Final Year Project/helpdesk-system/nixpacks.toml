[phases.setup]
nixPkgs = ["php", "phpPackages.composer", "nodejs", "npm"]

[phases.build]
cmds = ["composer install --no-dev --optimize-autoloader", "npm install", "npm run build", "php artisan key:generate", "php artisan config:clear", "php artisan migrate --force"]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
