[phases.setup]
nixPkgs = ["php83", "php83Extensions.pdo", "php83Extensions.pdo_sqlite", "php83Extensions.mbstring", "php83Extensions.tokenizer", "php83Extensions.xml", "php83Extensions.ctype", "php83Extensions.fileinfo", "php83Extensions.bcmath", "php83Extensions.curl", "composer"]

[phases.build]
cmds = ["composer install --no-dev", "npm install", "npm run build", "php artisan config:clear"]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
